name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: Repair to manylinux platform tag
        run: |
          uvx auditwheel repair --plat manylinux2014_x86_64 -w dist_repaired dist/*.whl
          rm dist/*.whl
          mv dist_repaired/*.whl dist/
      - name: Retag as Python-version-agnostic (ctypes, not a CPython extension)
        run: uvx wheel tags --python-tag py3 --abi-tag none --remove dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: Retag as Python-version-agnostic (ctypes, not a CPython extension)
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wheel) {
            throw "uv build did not produce a wheel in dist"
          }
          uvx wheel tags --python-tag py3 --abi-tag none --remove $wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: Retag as Python-version-agnostic (ctypes, not a CPython extension)
        run: uvx wheel tags --python-tag py3 --abi-tag none --remove dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  check-contents:
    needs: [build-linux, build-windows, build-macos, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate wheel and sdist metadata
        run: |
          python -m pip install check-wheel-contents twine
          check-wheel-contents dist/*.whl
          twine check dist/*

  test-wheels:
    needs: [build-linux, build-windows, build-macos]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux
          - os: windows-latest
            artifact: wheel-windows
          - os: macos-latest
            artifact: wheel-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install wheel and test dependencies
        run: |
          python -m pip install pytest numpy
          python -m pip install --no-index --no-deps --find-links dist pyLibMeshb
      - name: Run tests against installed wheel
        run: python -m pytest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-sdist, check-contents, test-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-sdist, check-contents, test-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyLibMeshb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/