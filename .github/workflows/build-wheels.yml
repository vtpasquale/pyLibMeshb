name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: Retag as Python-version-agnostic (ctypes, not a CPython extension)
        run: uvx wheel tags --python-tag py3 --abi-tag none --remove dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  build-windows:
    runs-on: ubuntu-latest
    env:
      TARGET: win-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: uv build --wheel
      - run: uvx wheel tags --platform-tag win_amd64 --remove dist/*.whl
      - name: Retag as Python-version-agnostic (ctypes, not a CPython extension)
        run: uvx wheel tags --python-tag py3 --abi-tag none --remove dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: Retag as Python-version-agnostic (ctypes, not a CPython extension)
        run: uvx wheel tags --python-tag py3 --abi-tag none --remove dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  check-contents:
    needs: [build-linux, build-windows, build-macos, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: pip install check-wheel-contents && check-wheel-contents dist/*.whl

  release:
    needs: [build-linux, build-windows, build-macos, build-sdist, check-contents]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-sdist, check-contents]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyLibMeshb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/