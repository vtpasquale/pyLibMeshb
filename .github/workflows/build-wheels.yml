name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  build-windows:
    runs-on: ubuntu-latest
    env:
      TARGET: win-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: uv build --wheel
      - run: uvx wheel tags --platform-tag win_amd64 --remove dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  check-contents:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: pip install check-wheel-contents && check-wheel-contents dist/*.whl

